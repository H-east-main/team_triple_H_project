<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>지도 - 여정</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>
    @import url(
      'https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap'
    );

    body {
      font-family: 'Pretendard', sans-serif;
    }

    #map {
      width: 100%;
      height: 620px;
    }

    .category-button.active {
      background-color: #0f172a;
      color: white;
      border-color: #0f172a;
    }

    .map-info-window {
      width: 230px;
      padding: 12px;
      background: white;
      color: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-sizing: border-box;
    }

    .map-info-window img {
      width: 100%;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    .map-info-window-title {
      display: block;
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 6px;
    }

    .map-info-window-address {
      margin: 0;
      color: #64748b;
      font-size: 12px;
      line-height: 1.4;
    }

    .map-info-window-category {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 8px;
      color: #475569;
      background: #f1f5f9;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
    }

    .place-list {
      scrollbar-width: thin;
    }

    .place-card.active {
      border-color: #0f172a;
      background-color: #f8fafc;
    }

    @media (max-width: 1024px) {
      #map {
        height: 500px;
      }
    }
  </style>
</head>

  <!--
    반드시 아래 YOUR_KAKAO_JAVASCRIPT_KEY를
    카카오 개발자 콘솔에서 발급받은 JavaScript 키로 교체하세요.
  -->
  <script
    src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=71948a33b79c605b09544aae56de5aa2">
  </script>

  <script>
    /*
     * JSON 파일 저장 위치 예시
     *
     * Spring Boot:
     * src/main/resources/static/data/travel-courses.json
     *
     * HTML에서 접근:
     * /data/travel-courses.json
     */

    const DATA_BASE_PATH = "/data/";

    const DEFAULT_CENTER = {
      latitude: 35.1595,
      longitude: 126.8526
    };

    const DEFAULT_LEVEL = 9;

    let map = null;

    let currentPlaces = [];
    let filteredPlaces = [];

    let markers = [];
    let infoWindows = [];

    let routePolyline = null;
    let selectedPlaceId = null;

    const mapElement = document.getElementById("map");
    const placeListElement = document.getElementById("placeList");
    const placeCountElement = document.getElementById("placeCount");
    const currentCategoryElement =
      document.getElementById("currentCategory");

    const loadingOverlay =
      document.getElementById("loadingOverlay");

    const statusBox =
      document.getElementById("statusBox");

    const searchInput =
      document.getElementById("searchInput");

    const routeSection =
      document.getElementById("routeSection");

    const routeList =
      document.getElementById("routeList");

    /*
     * 카카오맵 초기화
     */
function initializeKakaoMap() {
  if (!window.kakao || !window.kakao.maps) {
    hideLoading();

    showStatus(
      "카카오맵 SDK를 불러오지 못했습니다.",
      "error"
    );

    return;
  }

  const mapOption = {
    center: new kakao.maps.LatLng(
      DEFAULT_CENTER.latitude,
      DEFAULT_CENTER.longitude
    ),
    level: DEFAULT_LEVEL
  };

  map = new kakao.maps.Map(mapElement, mapOption);

  addMapControls();

  loadCategoryData(
    "travel-courses.json",
    "여행코스"
  );
}

    /*
     * 지도 확대/축소 및 지도 타입 컨트롤
     */
    function addMapControls() {
      const mapTypeControl =
        new kakao.maps.MapTypeControl();

      map.addControl(
        mapTypeControl,
        kakao.maps.ControlPosition.TOPRIGHT
      );

      const zoomControl =
        new kakao.maps.ZoomControl();

      map.addControl(
        zoomControl,
        kakao.maps.ControlPosition.RIGHT
      );
    }

    /*
     * JSON 파일 불러오기
     */
    async function loadJsonFile(fileName) {
      const response = await fetch(
        DATA_BASE_PATH + fileName
      );

      if (!response.ok) {
        throw new Error(
          `${fileName} 파일을 불러오지 못했습니다.`
        );
      }

      const data = await response.json();

      /*
       * 현재 JSON은 { items: [...] } 구조지만
       * 배열 자체로 저장된 JSON도 처리한다.
       */
      if (Array.isArray(data)) {
        return data;
      }

      if (Array.isArray(data.items)) {
        return data.items;
      }

      throw new Error(
        `${fileName}에서 items 배열을 찾을 수 없습니다.`
      );
    }

    /*
     * JSON 데이터를 지도용 공통 형식으로 변환
     */
    function normalizePlace(item, contentType) {
      return {
        id:
          item.contentid ??
          item.id ??
          cryptoRandomId(),

        title:
          item.title ??
          item.name ??
          "이름 없는 장소",

        address: [
          item.addr1,
          item.addr2
        ]
          .filter(Boolean)
          .join(" "),

        longitude: Number(
          item.mapx ??
          item.longitude
        ),

        latitude: Number(
          item.mapy ??
          item.latitude
        ),

        imageUrl:
          item.firstimage ||
          item.firstimage2 ||
          item.imageUrl ||
          "",

        contentType:
          item.contentType ||
          item.category ||
          contentType,

        categoryCode:
          item.cat3 ||
          item.categoryCode ||
          "",

        telephone:
          item.tel ||
          item.telephone ||
          "",

        original: item
      };
    }

    /*
     * 임시 ID 생성
     */
    function cryptoRandomId() {
      if (
        typeof crypto !== "undefined" &&
        typeof crypto.randomUUID === "function"
      ) {
        return crypto.randomUUID();
      }

      return (
        Date.now().toString() +
        Math.random().toString(16).slice(2)
      );
    }

    /*
     * 좌표 유효성 검사
     *
     * 광주·전라권 대략적인 좌표 범위도 함께 검사하여
     * 비정상 좌표를 제거한다.
     */
    function isValidCoordinate(place) {
      const latitude = place.latitude;
      const longitude = place.longitude;

      if (
        !Number.isFinite(latitude) ||
        !Number.isFinite(longitude)
      ) {
        return false;
      }

      if (
        latitude === 0 ||
        longitude === 0
      ) {
        return false;
      }

      return (
        latitude >= 33 &&
        latitude <= 37 &&
        longitude >= 124 &&
        longitude <= 129
      );
    }

    /*
     * 특정 카테고리 데이터 불러오기
     */
    async function loadCategoryData(
      fileName,
      contentType
    ) {
      showLoading();

      clearStatus();
      clearMapObjects();

      currentCategoryElement.textContent =
        contentType;

      try {
        const items =
          await loadJsonFile(fileName);

        currentPlaces = items
          .map(item =>
            normalizePlace(
              item,
              contentType
            )
          )
          .filter(isValidCoordinate);

        filteredPlaces =
          [...currentPlaces];

        displayPlaces(filteredPlaces);

        showStatus(
          `${contentType} 데이터 ${filteredPlaces.length}개를 불러왔습니다.`,
          "success"
        );
      } catch (error) {
        console.error(error);

        currentPlaces = [];
        filteredPlaces = [];

        displayPlaces([]);

        showStatus(
          `${contentType} 데이터를 불러오지 못했습니다. JSON 파일명과 저장 위치를 확인해주세요.`,
          "error"
        );
      } finally {
        hideLoading();
      }
    }

    /*
     * 지도에 장소 표시
     */
    function displayPlaces(places) {
      clearMapObjects();

      placeCountElement.textContent =
        places.length;

      renderPlaceList(places);

      if (!map || places.length === 0) {
        resetMapPosition();
        return;
      }

      const bounds =
        new kakao.maps.LatLngBounds();

      places.forEach((place, index) => {
        const position =
          new kakao.maps.LatLng(
            place.latitude,
            place.longitude
          );

        const marker =
          new kakao.maps.Marker({
            map,
            position,
            title: place.title
          });

        const infoWindow =
          new kakao.maps.InfoWindow({
            content:
              createInfoWindowContent(
                place,
                index
              ),
            removable: true
          });

        kakao.maps.event.addListener(
          marker,
          "click",
          () => {
            closeAllInfoWindows();

            infoWindow.open(
              map,
              marker
            );

            selectPlaceCard(
              place.id
            );
          }
        );

        markers.push({
          id: String(place.id),
          marker,
          place
        });

        infoWindows.push(infoWindow);

        bounds.extend(position);
      });

      if (places.length === 1) {
        map.setCenter(
          new kakao.maps.LatLng(
            places[0].latitude,
            places[0].longitude
          )
        );

        map.setLevel(5);
      } else {
        map.setBounds(bounds, 60, 60, 60, 60);
      }
    }

    /*
     * 인포윈도우 HTML
     */
    function createInfoWindowContent(
      place,
      index
    ) {
      const imageHtml = place.imageUrl
        ? `
          <img
            src="${escapeHtml(place.imageUrl)}"
            alt="${escapeHtml(place.title)}"
            onerror="this.style.display='none'"
          >
        `
        : "";

      const address =
        place.address ||
        "주소 정보 없음";

      return `
        <div class="map-info-window">
          ${imageHtml}

          <strong class="map-info-window-title">
            ${index + 1}.
            ${escapeHtml(place.title)}
          </strong>

          <p class="map-info-window-address">
            ${escapeHtml(address)}
          </p>

          <span class="map-info-window-category">
            ${escapeHtml(place.contentType)}
          </span>
        </div>
      `;
    }

    /*
     * 우측 장소 목록 출력
     */
    function renderPlaceList(places) {
      if (places.length === 0) {
        placeListElement.innerHTML = `
          <div class="py-16 text-center text-slate-400">
            <i class="fa-solid fa-location-dot text-3xl"></i>

            <p class="mt-3 text-sm font-semibold">
              표시할 장소가 없습니다.
            </p>

            <p class="mt-1 text-xs">
              다른 카테고리나 검색어를 선택해보세요.
            </p>
          </div>
        `;

        return;
      }

      placeListElement.innerHTML =
        places
          .map((place, index) => {
            const imageHtml =
              place.imageUrl
                ? `
                  <img
                    src="${escapeHtml(place.imageUrl)}"
                    alt="${escapeHtml(place.title)}"
                    class="w-20 h-20 object-cover rounded-xl shrink-0"
                    onerror="this.style.display='none'"
                  >
                `
                : `
                  <div
                    class="w-20 h-20 rounded-xl bg-slate-100
                           flex items-center justify-center
                           text-slate-400 shrink-0"
                  >
                    <i class="fa-regular fa-image text-xl"></i>
                  </div>
                `;

            return `
              <button
                type="button"
                class="place-card w-full text-left
                       border border-slate-200 rounded-2xl
                       p-3 hover:border-slate-400
                       hover:bg-slate-50 transition"
                data-place-id="${escapeHtml(place.id)}"
              >
                <div class="flex gap-3">
                  ${imageHtml}

                  <div class="min-w-0 flex-1">
                    <div class="flex items-start gap-2">
                      <span
                        class="shrink-0 w-6 h-6 rounded-full
                               bg-slate-900 text-white
                               text-xs font-bold
                               flex items-center justify-center"
                      >
                        ${index + 1}
                      </span>

                      <h3
                        class="font-bold text-sm leading-5
                               line-clamp-2"
                      >
                        ${escapeHtml(place.title)}
                      </h3>
                    </div>

                    <p
                      class="mt-2 text-xs text-slate-500
                             line-clamp-2"
                    >
                      ${escapeHtml(
                        place.address ||
                        "주소 정보 없음"
                      )}
                    </p>

                    <span
                      class="inline-block mt-2 px-2 py-1
                             rounded-full bg-slate-100
                             text-[11px] font-semibold
                             text-slate-500"
                    >
                      ${escapeHtml(place.contentType)}
                    </span>
                  </div>
                </div>
              </button>
            `;
          })
          .join("");

      document
        .querySelectorAll(".place-card")
        .forEach(card => {
          card.addEventListener(
            "click",
            () => {
              focusPlace(
                card.dataset.placeId
              );
            }
          );
        });
    }

    /*
     * 장소 목록 클릭 시 해당 마커로 이동
     */
    function focusPlace(placeId) {
      const target =
        markers.find(
          item =>
            item.id ===
            String(placeId)
        );

      if (!target) {
        return;
      }

      const place = target.place;

      map.panTo(
        new kakao.maps.LatLng(
          place.latitude,
          place.longitude
        )
      );

      map.setLevel(4);

      closeAllInfoWindows();

      const markerIndex =
        markers.indexOf(target);

      infoWindows[markerIndex].open(
        map,
        target.marker
      );

      selectPlaceCard(placeId);
    }

    /*
     * 선택된 장소 카드 표시
     */
    function selectPlaceCard(placeId) {
      selectedPlaceId =
        String(placeId);

      document
        .querySelectorAll(".place-card")
        .forEach(card => {
          card.classList.toggle(
            "active",
            card.dataset.placeId ===
              selectedPlaceId
          );
        });

      const selectedCard =
        document.querySelector(
          `.place-card[data-place-id="${cssEscape(
            selectedPlaceId
          )}"]`
        );

      selectedCard?.scrollIntoView({
        behavior: "smooth",
        block: "nearest"
      });
    }

    /*
     * 검색
     */
    function searchPlaces() {
      const keyword =
        searchInput.value
          .trim()
          .toLowerCase();

      if (!keyword) {
        filteredPlaces =
          [...currentPlaces];

        displayPlaces(
          filteredPlaces
        );

        return;
      }

      filteredPlaces =
        currentPlaces.filter(place => {
          const searchableText = [
            place.title,
            place.address,
            place.contentType,
            place.categoryCode
          ]
            .join(" ")
            .toLowerCase();

          return searchableText.includes(
            keyword
          );
        });

      displayPlaces(
        filteredPlaces
      );

      if (
        filteredPlaces.length === 0
      ) {
        showStatus(
          `"${searchInput.value.trim()}"에 해당하는 장소를 찾지 못했습니다.`,
          "warning"
        );
      } else {
        showStatus(
          `"${searchInput.value.trim()}" 검색 결과 ${filteredPlaces.length}개입니다.`,
          "success"
        );
      }
    }

    /*
     * 추천 장소를 외부에서 전달받았을 때 호출하는 함수
     *
     * 예:
     * displayRecommendedPlaces(response.places);
     */
    function displayRecommendedPlaces(
      recommendedPlaces
    ) {
      if (
        !Array.isArray(
          recommendedPlaces
        )
      ) {
        return;
      }

      const places =
        recommendedPlaces
          .map(item => {
            const normalized =
              normalizePlace(
                item,
                item.contentType ||
                item.category ||
                "추천 장소"
              );

            normalized.order =
              Number(
                item.order ??
                item.recommendedOrder
              );

            normalized.recommendationReason =
              item.recommendationReason ||
              "";

            return normalized;
          })
          .filter(isValidCoordinate)
          .sort(
            (a, b) =>
              (
                Number.isFinite(a.order)
                  ? a.order
                  : 999
              ) -
              (
                Number.isFinite(b.order)
                  ? b.order
                  : 999
              )
          );

      currentPlaces = places;
      filteredPlaces = places;

      currentCategoryElement.textContent =
        "맞춤 추천";

      displayPlaces(places);
      displayRoute(places);
    }

    /*
     * 추천 경로선 표시
     */
    function displayRoute(places) {
      clearRoute();

      if (places.length < 2) {
        return;
      }

      const path =
        places.map(place =>
          new kakao.maps.LatLng(
            place.latitude,
            place.longitude
          )
        );

      routePolyline =
        new kakao.maps.Polyline({
          map,
          path,
          strokeWeight: 6,
          strokeColor: "#0f172a",
          strokeOpacity: 0.8,
          strokeStyle: "solid"
        });

      renderRouteList(places);

      routeSection.classList.remove(
        "hidden"
      );
    }

    /*
     * 추천 경로 순서 출력
     */
    function renderRouteList(places) {
      routeList.innerHTML =
        places
          .map((place, index) => {
            const reason =
              place.recommendationReason
                ? `
                  <p class="text-xs text-slate-500 mt-2">
                    ${escapeHtml(
                      place.recommendationReason
                    )}
                  </p>
                `
                : "";

            return `
              <button
                type="button"
                class="text-left p-4 rounded-2xl
                       border border-slate-200
                       hover:border-slate-400
                       transition"
                onclick="focusPlace('${escapeJsString(
                  place.id
                )}')"
              >
                <div class="flex items-center gap-3">
                  <span
                    class="w-8 h-8 rounded-full
                           bg-slate-900 text-white
                           flex items-center justify-center
                           text-sm font-bold shrink-0"
                  >
                    ${index + 1}
                  </span>

                  <strong
                    class="text-sm leading-5
                           line-clamp-2"
                  >
                    ${escapeHtml(place.title)}
                  </strong>
                </div>

                ${reason}
              </button>
            `;
          })
          .join("");
    }

    /*
     * 경로 지우기
     */
    function clearRoute() {
      if (routePolyline) {
        routePolyline.setMap(null);
        routePolyline = null;
      }

      routeSection.classList.add(
        "hidden"
      );

      routeList.innerHTML = "";
    }

    /*
     * 마커와 인포윈도우 제거
     */
    function clearMapObjects() {
      markers.forEach(item => {
        item.marker.setMap(null);
      });

      closeAllInfoWindows();

      markers = [];
      infoWindows = [];
      selectedPlaceId = null;

      clearRoute();
    }

    function closeAllInfoWindows() {
      infoWindows.forEach(infoWindow => {
        infoWindow.close();
      });
    }

    /*
     * 지도 초기 위치
     */
    function resetMapPosition() {
      if (!map) {
        return;
      }

      map.setCenter(
        new kakao.maps.LatLng(
          DEFAULT_CENTER.latitude,
          DEFAULT_CENTER.longitude
        )
      );

      map.setLevel(
        DEFAULT_LEVEL
      );
    }

    /*
     * 지도 전체 초기화
     */
    function resetMap() {
      searchInput.value = "";

      filteredPlaces =
        [...currentPlaces];

      displayPlaces(
        filteredPlaces
      );

      clearStatus();
    }

    /*
     * 상태 메시지
     */
    function showStatus(
      message,
      type = "success"
    ) {
      const styleMap = {
        success:
          "bg-emerald-50 text-emerald-700 border border-emerald-200",

        warning:
          "bg-amber-50 text-amber-700 border border-amber-200",

        error:
          "bg-red-50 text-red-700 border border-red-200"
      };

      statusBox.className =
        `mb-5 px-4 py-3 rounded-xl text-sm font-semibold ${
          styleMap[type] ||
          styleMap.success
        }`;

      statusBox.textContent =
        message;

      statusBox.classList.remove(
        "hidden"
      );
    }

    function clearStatus() {
      statusBox.classList.add(
        "hidden"
      );

      statusBox.textContent = "";
    }

    function showLoading() {
      loadingOverlay.classList.remove(
        "hidden"
      );
    }

    function hideLoading() {
      loadingOverlay.classList.add(
        "hidden"
      );
    }

    /*
     * HTML 보안 처리
     */
    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function escapeJsString(value) {
      return String(value ?? "")
        .replaceAll("\\", "\\\\")
        .replaceAll("'", "\\'");
    }

    function cssEscape(value) {
      if (
        typeof CSS !== "undefined" &&
        typeof CSS.escape === "function"
      ) {
        return CSS.escape(value);
      }

      return value.replace(
        /["\\]/g,
        "\\$&"
      );
    }

    /*
     * 카테고리 버튼 이벤트
     */
    document
      .querySelectorAll(
        ".category-button"
      )
      .forEach(button => {
        button.addEventListener(
          "click",
          () => {
            document
              .querySelectorAll(
                ".category-button"
              )
              .forEach(item => {
                item.classList.remove(
                  "active"
                );
              });

            button.classList.add(
              "active"
            );

            searchInput.value = "";

            loadCategoryData(
              button.dataset.file,
              button.dataset.type
            );
          }
        );
      });

    document
      .getElementById("searchButton")
      .addEventListener(
        "click",
        searchPlaces
      );

    searchInput.addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          searchPlaces();
        }
      }
    );

    document
      .getElementById(
        "resetMapButton"
      )
      .addEventListener(
        "click",
        resetMap
      );

    document
      .getElementById(
        "clearRouteButton"
      )
      .addEventListener(
        "click",
        clearRoute
      );

    /*
     * 다른 JS 파일에서도 추천 결과를 지도에 표시할 수 있게 공개
     */
    window.displayRecommendedPlaces =
      displayRecommendedPlaces;

    /*
     * 실행
     */
    document.addEventListener(
      "DOMContentLoaded",
      initializeKakaoMap
    );
  </script>
</body>
</html>
