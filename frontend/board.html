<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>여정: 여행 추천 게시판</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  >

  <style>
    @import url(
      'https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700&display=swap'
    );

    body {
      font-family: 'Pretendard', sans-serif;
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 1.5rem;
    }
  </style>
</head>

<body class="min-h-screen bg-slate-50 p-6 text-slate-800 md:p-10">

  <!-- 상단 메뉴 -->
  <header class="mx-auto mb-10 flex w-full max-w-7xl justify-center">
    <nav
      class="flex gap-1 rounded-full border border-slate-200
             bg-white/80 px-2 py-1.5 shadow-sm backdrop-blur-md"
    >
      <a
        href="index.html"
        class="rounded-full px-6 py-2 text-sm font-semibold
               text-slate-600 hover:bg-slate-100"
      >
        홈
      </a>

      <a
        href="board.html"
        class="rounded-full bg-slate-900 px-6 py-2 text-sm
               font-semibold text-white shadow-sm"
      >
        게시판
      </a>

      <a
        href="map.html"
        class="rounded-full px-6 py-2 text-sm font-semibold
               text-slate-600 hover:bg-slate-100"
      >
        지도
      </a>
    </nav>
  </header>

  <!-- 게시판 본문 -->
  <main class="mx-auto w-full max-w-7xl">

    <div class="mb-8 flex items-center justify-between px-2">
      <h1 class="text-3xl font-extrabold text-slate-900">
        <i class="fa-solid fa-camera-retro mr-2 text-sky-500"></i>
        여행 추천 게시판
      </h1>

      <button
        type="button"
        class="rounded-full bg-sky-500 px-5 py-2.5 text-sm
               font-semibold text-white shadow-sm transition
               hover:bg-sky-600"
      >
        <i class="fa-solid fa-pen mr-1"></i>
        글쓰기
      </button>
    </div>

    <!-- 게시글 목록 -->
    <div
      id="board-grid"
      class="w-full columns-1 gap-6 sm:columns-2
             md:columns-3 lg:columns-4"
    >
      <div class="py-20 text-center text-slate-400">
        <i class="fa-solid fa-spinner fa-spin mb-2 text-3xl"></i>
        <p>게시글을 불러오는 중...</p>
      </div>
    </div>
  </main>

  <!-- 상세보기 모달 -->
  <div
    id="detail-modal"
    class="fixed inset-0 z-50 hidden items-center justify-center
           bg-slate-950/60 p-4 backdrop-blur-sm"
  >
    <div
      class="flex max-h-[90vh] w-full max-w-2xl flex-col
             overflow-hidden rounded-2xl border border-slate-100
             bg-white shadow-2xl"
    >
      <!-- 게시글 이미지 -->
      <div class="relative h-64 w-full bg-slate-200 sm:h-80">
        <img
          id="modal-img"
          src=""
          alt="게시글 이미지"
          class="h-full w-full object-cover"
        >

        <button
          type="button"
          onclick="closeModal()"
          class="absolute right-4 top-4 flex h-10 w-10
                 items-center justify-center rounded-full bg-black/50
                 text-white transition hover:bg-black/70"
        >
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- 게시글 내용 -->
      <div class="space-y-4 overflow-y-auto p-6">
        <div>
          <span
            id="modal-category"
            class="text-xs font-semibold uppercase tracking-wider
                   text-sky-600"
          >
            카테고리
          </span>

          <h2
            id="modal-title"
            class="mt-1 text-2xl font-bold text-slate-900"
          >
            게시글 제목
          </h2>

          <p
            id="modal-date"
            class="mt-2 text-xs text-slate-400"
          >
          </p>
        </div>

        <p
          id="modal-content"
          class="whitespace-pre-line text-sm leading-relaxed
                 text-slate-600 md:text-base"
        >
          게시글 내용
        </p>
      </div>
    </div>
  </div>

  <script>
    const API_URL = 'http://127.0.0.1:8000/api/posts';

    const DEFAULT_IMAGE =
      'https://images.unsplash.com/photo-1507525428034-b723cf961d3e'
      + '?auto=format&fit=crop&w=1000&q=80';

    let postData = [];

    window.addEventListener('DOMContentLoaded', loadPosts);

    async function loadPosts() {
      try {
        const response = await axios.get(API_URL);

        console.log('게시글 응답:', response.data);

        postData = response.data;
        renderBoard(postData);
      } catch (error) {
        console.error('게시글 로드 실패:', error);
        console.error('백엔드 응답:', error.response?.data);

        const grid = document.getElementById('board-grid');

        grid.innerHTML = `
          <div class="py-20 text-center font-semibold text-rose-500">
            <i class="fa-solid fa-circle-exclamation mb-2 text-3xl"></i>
            <p>게시글을 불러오지 못했습니다.</p>
            <p class="mt-2 text-sm font-normal text-slate-400">
              FastAPI 서버가 실행 중인지 확인해 주세요.
            </p>
          </div>
        `;
      }
    }

    function renderBoard(posts) {
      const grid = document.getElementById('board-grid');
      grid.innerHTML = '';

      if (!Array.isArray(posts) || posts.length === 0) {
        grid.innerHTML = `
          <div class="py-20 text-center text-slate-400">
            <i class="fa-regular fa-folder-open mb-3 text-3xl"></i>
            <p>등록된 게시글이 없습니다.</p>
          </div>
        `;
        return;
      }

      const heightClasses = [
        'h-56',
        'h-72',
        'h-64',
        'h-80',
        'h-60'
      ];

      posts.forEach((post, index) => {
        const imageUrl = post.image_url || DEFAULT_IMAGE;
        const heightClass =
          heightClasses[index % heightClasses.length];

        const card = document.createElement('article');

        card.className = `
          masonry-item group relative ${heightClass}
          w-full cursor-pointer overflow-hidden rounded-2xl
          border border-slate-200 bg-slate-200 shadow-sm
          transition-all duration-300 hover:-translate-y-1
          hover:shadow-xl
        `;

        card.addEventListener('click', () => openModal(index));

        card.innerHTML = `
          <img
            src="${escapeHtml(imageUrl)}"
            alt="${escapeHtml(post.title)}"
            class="h-full w-full object-cover
                   transition-transform duration-500
                   group-hover:scale-105"
            onerror="this.src='${DEFAULT_IMAGE}'"
          >

          <div
            class="absolute inset-0 flex flex-col justify-end
                   bg-gradient-to-t from-black/85 via-black/25
                   to-transparent p-4"
          >
            <span class="mb-1 text-xs font-semibold text-sky-300">
              ${escapeHtml(post.category)}
            </span>

            <h2
              class="line-clamp-2 text-base font-bold text-white
                     md:text-lg"
            >
              ${escapeHtml(post.title)}
            </h2>

            <p class="mt-1 line-clamp-2 text-xs text-slate-300">
              ${escapeHtml(post.content)}
            </p>

            <p class="mt-3 text-xs text-slate-400">
              ${formatDate(post.created_at)}
            </p>
          </div>
        `;

        grid.appendChild(card);
      });
    }

    function openModal(index) {
      const post = postData[index];

      if (!post) {
        return;
      }

      const modal = document.getElementById('detail-modal');
      const modalImage = document.getElementById('modal-img');

      modalImage.src = post.image_url || DEFAULT_IMAGE;
      modalImage.alt = post.title || '게시글 이미지';

      modalImage.onerror = function () {
        this.src = DEFAULT_IMAGE;
      };

      document.getElementById('modal-category').innerText =
        post.category || '광주·전라권';

      document.getElementById('modal-title').innerText =
        post.title || '제목 없음';

      document.getElementById('modal-content').innerText =
        post.content || '내용이 없습니다.';

      document.getElementById('modal-date').innerText =
        formatDate(post.created_at);

      modal.classList.remove('hidden');
      modal.classList.add('flex');

      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      const modal = document.getElementById('detail-modal');

      modal.classList.add('hidden');
      modal.classList.remove('flex');

      document.body.style.overflow = '';
    }

    function formatDate(dateString) {
      if (!dateString) {
        return '';
      }

      const date = new Date(dateString);

      return date.toLocaleString('ko-KR', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit'
      });
    }

    function escapeHtml(value) {
      const element = document.createElement('div');
      element.textContent = value ?? '';
      return element.innerHTML;
    }

    document
      .getElementById('detail-modal')
      .addEventListener('click', function (event) {
        if (event.target === this) {
          closeModal();
        }
      });

    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape') {
        closeModal();
      }
    });
  </script>
</body>
</html>
